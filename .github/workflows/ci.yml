# CI: the checks every pull request must pass before it can merge into dev or main.
# Why each line exists is explained in docs/guides/ci-setup.md (step 1).
name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

# The workflow can read the code and nothing else.
permissions:
  contents: read

# A new push to the same pull request cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # AGENTS.md and CLAUDE.md must match .acp/ (and must not be edited by hand).
      - run: node dist/src/cli/main.js memory:sync --check

  docker:
    name: Docker image starts and is healthy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # A .env written for running outside Docker must not break the container
      # (it once pointed ACP_DATA_DIR at the read-only app folder).
      - run: printf 'ACP_DATA_DIR=.data\nACP_UI_HOST=127.0.0.1\n' > .env
      # Same settings people use locally (compose.yaml): read-only, no capabilities.
      - run: docker compose up -d --build
      - name: Wait for the health check
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q acp)")
            echo "health: $status"
            [ "$status" = healthy ] && exit 0
            sleep 3
          done
          docker compose logs acp
          exit 1
      - run: curl -fsS http://127.0.0.1:4317/healthz
      - if: always()
        run: docker compose down -v
